schema: mechcad-harness
version: 1
rules:
  - when:
      - /materials/*
    invalidates:
      - analysis.materials
      - analysis.structural
      - analysis.fits
      - analysis.transmission_strength
      - validation.geometry
  - when:
      - /components/*/transmission/*
    invalidates:
      - analysis.transmission
      - analysis.packaging
      - validation.collision
  - when:
      - /components/*/placement/*
    invalidates:
      - analysis.packaging
      - validation.collision
      - validation.assembly
  - when:
      - /requirements/*
    invalidates:
      - analysis.requirements
      - analysis.loads
  - when:
      - /requirements/REQ-TORQUE-FORCE/description
    invalidates:
      - analysis.transmission.torque
  - when:
      - /requirements/REQ-TORQUE-ARM/description
    invalidates:
      - analysis.transmission.torque
  - when:
      - /requirements/REQ-TORQUE-SAFETY/description
    invalidates:
      - analysis.transmission.torque
edges:
  - from: analysis.loads
    to: analysis.structural
  - from: analysis.structural
    to: validation.structural
